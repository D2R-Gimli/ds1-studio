[package]
license = "MIT"
repository = "https://github.com/RoofooEvazan/ds1-studio"
name = "ds1-studio"
version = "0.2.63"
description = "Diablo II DS1 map editor"
edition = "2021"

[lib]
name = "ds1_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
